    body { font-family: sans-serif; margin: 0 auto; max-width: 800px; padding: 20px; }
    .img-block {
        text-align: center;
        margin-bottom: 10px;
        page-break-inside: avoid; 
        break-inside: avoid;
    }
    img { max-width: 100%; height: auto; border: 1px solid #ddd; }
    
    /* Print styles - The Fix */
    @media print {
        @page { margin: 0.5in; size: letter; }
        body { width: 100%; max-width: none; margin: 0; padding: 0; }
        .img-block { margin-bottom: 5px; display: block; }
        img {
            border: none;
            max-height: 9.5in; /* Ensure image fits on one page */
