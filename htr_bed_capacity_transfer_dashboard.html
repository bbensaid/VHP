
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.ticker{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0 14px;border-bottom:0.5px solid var(--color-border-tertiary)}
.tick-chip{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-text-secondary);background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:20px;padding:3px 10px 3px 6px}
.tick-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.tabs{display:flex;gap:0;border-bottom:0.5px solid var(--color-border-tertiary);margin-top:18px}
.tab{font-size:13px;padding:8px 18px;cursor:pointer;color:var(--color-text-secondary);border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;white-space:nowrap}
.tab.active{color:var(--color-text-primary);border-bottom-color:var(--color-text-primary);font-weight:500}
.panel{display:none;padding-top:18px}
.panel.active{display:block}
.section-label{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-tertiary);margin-bottom:12px}
.hosp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.hosp-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:12px 14px;cursor:pointer;transition:border-color .15s}
.hosp-card:hover{border-color:var(--color-border-secondary)}
.hosp-card.selected{border-color:#185FA5;border-width:1.5px}
.hosp-name{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:2px}
.hosp-type{font-size:11px;color:var(--color-text-tertiary);margin-bottom:10px}
.bed-rows{display:flex;flex-direction:column;gap:5px}
.bed-row{display:flex;align-items:center;gap:8px}
.bed-label{font-size:11px;color:var(--color-text-secondary);width:60px;flex-shrink:0}
.bed-bar-wrap{flex:1;height:6px;background:var(--color-background-tertiary);border-radius:3px;overflow:hidden}
.bed-bar{height:100%;border-radius:3px;transition:width .3s}
.bed-num{font-size:11px;color:var(--color-text-secondary);width:32px;text-align:right;flex-shrink:0}
.status-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:12px;margin-top:9px}
.status-green{background:#EAF3DE;color:#3B6D11}
.status-amber{background:#FAEEDA;color:#854F0B}
.status-red{background:#FCEBEB;color:#A32D2D}
.detail-pane{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:16px;margin-top:14px}
.detail-title{font-size:14px;font-weight:500;margin-bottom:12px;color:var(--color-text-primary)}
.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.metric-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px 12px}
.metric-label{font-size:11px;color:var(--color-text-secondary);margin-bottom:4px}
.metric-val{font-size:20px;font-weight:500;color:var(--color-text-primary)}
.metric-sub{font-size:11px;color:var(--color-text-tertiary);margin-top:2px}
.transfer-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--color-text-secondary)}
.field select,.field input{font-size:13px;padding:7px 10px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);width:100%}
.run-btn{grid-column:1/-1;padding:8px;background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);font-size:13px;cursor:pointer;color:var(--color-text-primary)}
.run-btn:hover{background:var(--color-background-secondary)}
.result-list{display:flex;flex-direction:column;gap:8px}
.result-row{display:flex;align-items:center;gap:12px;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:12px 14px}
.rank-badge{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0}
.rank-1{background:#EAF3DE;color:#3B6D11}
.rank-2{background:#E6F1FB;color:#185FA5}
.rank-3{background:#F1EFE8;color:#5F5E5A}
.result-info{flex:1}
.result-name{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.result-meta{font-size:12px;color:var(--color-text-secondary);margin-top:2px}
.result-score{text-align:right}
.score-num{font-size:18px;font-weight:500;color:var(--color-text-primary)}
.score-label{font-size:11px;color:var(--color-text-tertiary)}
.match-tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.match-tag{font-size:11px;padding:2px 7px;border-radius:10px;background:var(--color-background-secondary);color:var(--color-text-secondary);border:0.5px solid var(--color-border-tertiary)}
.match-tag.hit{background:#E6F1FB;color:#185FA5;border-color:#B5D4F4}
.repat-list{display:flex;flex-direction:column;gap:8px}
.repat-row{display:flex;align-items:center;gap:12px;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:12px 14px}
.repat-info{flex:1}
.repat-name{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.repat-sub{font-size:12px;color:var(--color-text-secondary);margin-top:2px}
.repat-days{font-size:11px;margin-top:4px}
.repat-days span{color:#854F0B;font-weight:500}
.action-btn{font-size:12px;padding:5px 12px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:none;cursor:pointer;color:var(--color-text-primary);white-space:nowrap}
.action-btn:hover{background:var(--color-background-secondary)}
.empty-state{text-align:center;padding:32px;color:var(--color-text-tertiary);font-size:13px}
.filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filter-row label{font-size:12px;color:var(--color-text-secondary)}
.filter-row select{font-size:12px;padding:5px 8px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary)}
.surge-banner{background:#FAEEDA;border:0.5px solid #FAC775;border-radius:var(--border-radius-md);padding:8px 12px;font-size:12px;color:#854F0B;margin-bottom:14px;display:none}
.legend{display:flex;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--color-text-secondary)}
.leg-dot{width:9px;height:9px;border-radius:50%}
</style>

<div id="root">
<div class="ticker" id="ticker-bar"></div>

<div class="tabs">
  <button class="tab active" onclick="showTab('capacity')">Capacity grid</button>
  <button class="tab" onclick="showTab('transfer')">Transfer routing</button>
  <button class="tab" onclick="showTab('repat')">Repatriation queue</button>
</div>

<div class="panel active" id="panel-capacity">
  <div class="filter-row">
    <label>Filter:</label>
    <select onchange="filterCards(this.value)">
      <option value="all">All hospitals</option>
      <option value="critical">Critical access only</option>
      <option value="regional">Regional only</option>
      <option value="tertiary">Tertiary only</option>
    </select>
    <select onchange="sortCards(this.value)" style="margin-left:4px">
      <option value="name">Sort: name</option>
      <option value="avail">Sort: most available</option>
      <option value="stress">Sort: highest stress</option>
    </select>
  </div>
  <div class="legend">
    <div class="leg-item"><div class="leg-dot" style="background:#63991f"></div>Available</div>
    <div class="leg-item"><div class="leg-dot" style="background:#BA7517"></div>Limited</div>
    <div class="leg-item"><div class="leg-dot" style="background:#E24B4A"></div>Critical</div>
  </div>
  <div id="surge-banner" class="surge-banner">⚠ Surge alert: UVMMC ICU at 97% capacity. Transfers may be delayed.</div>
  <div class="hosp-grid" id="hosp-grid"></div>
  <div id="hosp-detail"></div>
</div>

<div class="panel" id="panel-transfer">
  <div class="section-label">Find the best receiving hospital</div>
  <div class="transfer-form">
    <div class="field">
      <label>Sending hospital</label>
      <select id="t-from"></select>
    </div>
    <div class="field">
      <label>Acuity level</label>
      <select id="t-acuity">
        <option value="icu">ICU / critical care</option>
        <option value="medsurg" selected>Med-surg</option>
        <option value="behavioral">Behavioral health</option>
        <option value="snf">Skilled nursing / step-down</option>
      </select>
    </div>
    <div class="field">
      <label>Specialty needed</label>
      <select id="t-specialty">
        <option value="any">Any / general medicine</option>
        <option value="cardiac">Cardiac</option>
        <option value="neuro">Neurology / stroke</option>
        <option value="ortho">Orthopedics</option>
        <option value="psych">Psychiatry</option>
        <option value="peds">Pediatrics</option>
        <option value="oncology">Oncology</option>
      </select>
    </div>
    <div class="field">
      <label>Transport available</label>
      <select id="t-transport">
        <option value="ground">Ground ambulance</option>
        <option value="air">Air transport</option>
        <option value="either">Either</option>
      </select>
    </div>
    <button class="run-btn" onclick="runTransfer()">Find best match ↗</button>
  </div>
  <div id="transfer-results"></div>
</div>

<div class="panel" id="panel-repat">
  <div class="section-label">Patients ready for step-down or home hospital return</div>
  <div class="filter-row">
    <label>At facility:</label>
    <select onchange="filterRepat(this.value)" id="repat-filter">
      <option value="all">All tertiary centers</option>
      <option value="UVMMC">UVMMC</option>
      <option value="DHMC">Dartmouth-Hitchcock</option>
    </select>
  </div>
  <div id="repat-list"></div>
</div>
</div>

<script>
const HOSPITALS = [
  {id:'uvmmc',name:'UVM Medical Center',short:'UVMMC',type:'tertiary',region:'Chittenden',
   beds:{icu:{total:32,avail:1},medsurg:{total:180,avail:12},behavioral:{total:24,avail:4},snf:{total:0,avail:0}},

   beds:{icu:{total:40,avail:6},medsurg:{total:160,avail:22},behavioral:{total:18,avail:2},snf:{total:0,avail:0}},
   specialties:['cardiac','neuro','ortho','psych','oncology'],transfer_center:true},
  {id:'cvmc',name:'Central VT Medical Center',short:'CVMC',type:'regional',region:'Washington',
   beds:{icu:{total:12,avail:4},medsurg:{total:68,avail:18},behavioral:{total:10,avail:3},snf:{total:20,avail:7}},
   specialties:['cardiac','ortho'],transfer_center:false},
  {id:'svmc',name:'Southwestern VT Medical Center',short:'SVMC',type:'regional',region:'Bennington',
   beds:{icu:{total:8,avail:3},medsurg:{total:52,avail:11},behavioral:{total:6,avail:1},snf:{total:14,avail:5}},
   specialties:['cardiac','ortho'],transfer_center:false},
  {id:'rrmc',name:'Rutland Regional Medical Center',short:'RRMC',type:'regional',region:'Rutland',
   beds:{icu:{total:10,avail:2},medsurg:{total:72,avail:9},behavioral:{total:8,avail:0},snf:{total:18,avail:4}},
   specialties:['cardiac','ortho','neuro'],transfer_center:false},
  {id:'nvrh',name:'Northeastern VT Regional',short:'NVRH',type:'critical',region:'Caledonia',
   beds:{icu:{total:4,avail:2},medsurg:{total:25,avail:6},behavioral:{total:4,avail:1},snf:{total:10,avail:3}},
   specialties:['any'],transfer_center:false},
  {id:'nch',name:'North Country Hospital',short:'NCH',type:'critical',region:'Orleans',
   beds:{icu:{total:4,avail:1},medsurg:{total:25,avail:9},behavioral:{total:4,avail:2},snf:{total:8,avail:2}},
   specialties:['any'],transfer_center:false},
  {id:'pmh',name:'Porter Medical Center',short:'PMH',type:'critical',region:'Addison',
   beds:{icu:{total:4,avail:3},medsurg:{total:25,avail:11},behavioral:{total:0,avail:0},snf:{total:10,avail:6}},
   specialties:['any'],transfer_center:false},
  {id:'sph',name:'Springfield Hospital',short:'SPH',type:'critical',region:'Windsor South',
   beds:{icu:{total:2,avail:0},medsurg:{total:25,avail:3},behavioral:{total:0,avail:0},snf:{total:6,avail:1}},
   specialties:['any'],transfer_center:false},
  {id:'gifford',name:'Gifford Medical Center',short:'GMC',type:'critical',region:'Orange',
   beds:{icu:{total:4,avail:2},medsurg:{total:25,avail:8},behavioral:{total:4,avail:2},snf:{total:12,avail:5}},
   specialties:['any'],transfer_center:false},
  {id:'mah',name:'Mt. Ascutney Hospital',short:'MAH',type:'critical',region:'Windsor North',
   beds:{icu:{total:2,avail:1},medsurg:{total:18,avail:5},behavioral:{total:0,avail:0},snf:{total:14,avail:7}},
   specialties:['any'],transfer_center:false},
  {id:'bmh',name:'Brattleboro Memorial',short:'BMH',type:'critical',region:'Windham',
   beds:{icu:{total:4,avail:2},medsurg:{total:37,avail:7},behavioral:{total:8,avail:1},snf:{total:0,avail:0}},
   specialties:['psych','any'],transfer_center:false},
  {id:'gcottage',name:'Grace Cottage Hospital',short:'GCH',type:'critical',region:'Windham North',
   beds:{icu:{total:0,avail:0},medsurg:{total:19,avail:6},behavioral:{total:0,avail:0},snf:{total:10,avail:4}},
   specialties:['any'],transfer_center:false},
  {id:'copley',name:'Copley Hospital',short:'CPH',type:'critical',region:'Lamoille',
   beds:{icu:{total:4,avail:2},medsurg:{total:25,avail:9},behavioral:{total:4,avail:1},snf:{total:8,avail:3}},
   specialties:['any'],transfer_center:false},
];

const REPAT_PATIENTS = [
  {id:'p1',name:'Patient A',age:72,dx:'Post-CABG recovery',at:'UVMMC',home:'CVMC',los:8,target_los:5,days_over:3,acuity:'medsurg',specialty:'cardiac',blocker:'Transport coordination pending'},
  {id:'p2',name:'Patient B',age:58,dx:'Hip replacement rehab',at:'UVMMC',home:'RRMC',los:6,target_los:4,days_over:2,acuity:'snf',specialty:'ortho',blocker:'SNF bed confirmed at RRMC'},
  {id:'p3',name:'Patient C',age:81,dx:'Stroke — stable',at:'DHMC',home:'NVRH',los:11,target_los:7,days_over:4,acuity:'medsurg',specialty:'neuro',blocker:'Family consent pending'},
  {id:'p4',name:'Patient D',age:45,dx:'Pneumonia — resolving',at:'UVMMC',home:'NCH',los:5,target_los:3,days_over:2,acuity:'medsurg',specialty:'any',blocker:'Discharge orders placed'},
  {id:'p5',name:'Patient E',age:67,dx:'Behavioral health stabilization',at:'DHMC',home:'BMH',los:14,target_los:10,days_over:4,acuity:'behavioral',specialty:'psych',blocker:'Bed confirmed at BMH'},
  {id:'p6',name:'Patient F',age:54,dx:'CHF management',at:'UVMMC',home:'PMH',los:9,target_los:6,days_over:3,acuity:'medsurg',specialty:'cardiac',blocker:'Outpatient cardiology f/u needed'},
];

let selectedHosp = null;
let repatFilter = 'all';

function bedColor(avail, total) {
  if (total === 0) return '#B4B2A9';
  const pct = avail / total;
  if (pct > 0.2) return '#639922';
  if (pct > 0.05) return '#BA7517';
  return '#E24B4A';
}

function bedStatus(avail, total) {
  if (total === 0) return null;
  const pct = avail / total;
  if (pct > 0.2) return {cls:'status-green', label:'Available'};
  if (pct > 0.05) return {cls:'status-amber', label:'Limited'};
  return {cls:'status-red', label:'Critical'};
}

function overallStatus(h) {
  const key = ['icu','medsurg','behavioral','snf'];
  let minPct = 1;
  key.forEach(k => {
    if (h.beds[k].total > 0) {
      const p = h.beds[k].avail / h.beds[k].total;
      if (p < minPct) minPct = p;
    }
  });
  if (minPct > 0.2) return {cls:'status-green', label:'Capacity available'};
  if (minPct > 0.05) return {cls:'status-amber', label:'Capacity limited'};
  return {cls:'status-red', label:'Near capacity'};
}

function totalAvail(h) {
  return Object.values(h.beds).reduce((s,b) => s + b.avail, 0);
}

function renderTicker() {
  const bar = document.getElementById('ticker-bar');
  bar.innerHTML = HOSPITALS.slice(0,8).map(h => {
    const avail = totalAvail(h);
    const color = avail > 15 ? '#639922' : avail > 5 ? '#BA7517' : '#E24B4A';
    return `<div class="tick-chip"><div class="tick-dot" style="background:${color}"></div>${h.short}: <b style="color:var(--color-text-primary)">${avail}</b> avail</div>`;
  }).join('');
}

function renderGrid(filter='all', sort='name') {
  let hosps = [...HOSPITALS];
  if (filter !== 'all') hosps = hosps.filter(h => h.type === filter);
  if (sort === 'avail') hosps.sort((a,b) => totalAvail(b) - totalAvail(a));
  else if (sort === 'stress') hosps.sort((a,b) => totalAvail(a) - totalAvail(b));
  else hosps.sort((a,b) => a.name.localeCompare(b.name));

  const grid = document.getElementById('hosp-grid');
  const bedTypes = [{k:'icu',label:'ICU'},{k:'medsurg',label:'Med-surg'},{k:'behavioral',label:'Behav.'},{k:'snf',label:'SNF/step-down'}];
  
  grid.innerHTML = hosps.map(h => {
    const st = overallStatus(h);
    const rows = bedTypes.map(bt => {
      const b = h.beds[bt.k];
      if (b.total === 0) return '';
      const pct = Math.round((b.avail / b.total) * 100);
      const color = bedColor(b.avail, b.total);
      return `<div class="bed-row">
        <div class="bed-label">${bt.label}</div>
        <div class="bed-bar-wrap"><div class="bed-bar" style="width:${pct}%;background:${color}"></div></div>
        <div class="bed-num">${b.avail}/${b.total}</div>
      </div>`;
    }).join('');
    const sel = selectedHosp === h.id ? ' selected' : '';
    return `<div class="hosp-card${sel}" onclick="selectHosp('${h.id}')">
      <div class="hosp-name">${h.name}</div>
      <div class="hosp-type">${h.type.charAt(0).toUpperCase()+h.type.slice(1)} · ${h.region}</div>
      <div class="bed-rows">${rows}</div>
      <div class="status-badge ${st.cls}">${st.label}</div>
    </div>`;
  }).join('');

  document.getElementById('surge-banner').style.display = 
    HOSPITALS.find(h=>h.id==='uvmmc').beds.icu.avail <= 2 ? 'block' : 'none';
}

function selectHosp(id) {
  selectedHosp = selectedHosp === id ? null : id;
  renderGrid(document.querySelector('#panel-capacity select').value, 
             document.querySelectorAll('#panel-capacity select')[1].value);
  renderDetail();
}

function renderDetail() {
  const pane = document.getElementById('hosp-detail');
  if (!selectedHosp) { pane.innerHTML = ''; return; }
  const h = HOSPITALS.find(x => x.id === selectedHosp);
  const total = Object.values(h.beds).reduce((s,b)=>s+b.total,0);
  const avail = totalAvail(h);
  const occ = total > 0 ? Math.round(((total-avail)/total)*100) : 0;
  const pending = Math.round(avail * 0.3);
  pane.innerHTML = `<div class="detail-pane">
    <div class="detail-title">${h.name} — detail view</div>
    <div class="detail-grid">
      <div class="metric-card"><div class="metric-label">Total beds</div><div class="metric-val">${total}</div><div class="metric-sub">all types</div></div>
      <div class="metric-card"><div class="metric-label">Available now</div><div class="metric-val" style="color:#3B6D11">${avail}</div><div class="metric-sub">across all units</div></div>
      <div class="metric-card"><div class="metric-label">Occupancy</div><div class="metric-val">${occ}%</div><div class="metric-sub">current</div></div>
      <div class="metric-card"><div class="metric-label">Pending discharge</div><div class="metric-val">${pending}</div><div class="metric-sub">est. next 24h</div></div>
    </div>
    <div style="margin-top:10px;font-size:12px;color:var(--color-text-secondary)">Specialties on staff: ${h.specialties.join(', ')} ${h.transfer_center?'· <span style="color:#185FA5">Transfer center active</span>':''}</div>
  </div>`;
}

function filterCards(val) { renderGrid(val, document.querySelectorAll('#panel-capacity select')[1].value); }
function sortCards(val) { renderGrid(document.querySelector('#panel-capacity select').value, val); }

function populateTransferSelect() {
  const sel = document.getElementById('t-from');
  sel.innerHTML = HOSPITALS.map(h => `<option value="${h.id}">${h.name}</option>`).join('');
}

function runTransfer() {
  const fromId = document.getElementById('t-from').value;
  const acuity = document.getElementById('t-acuity').value;
  const specialty = document.getElementById('t-specialty').value;
  const from = HOSPITALS.find(h => h.id === fromId);
  
  const candidates = HOSPITALS.filter(h => {
    if (h.id === fromId) return false;
    if (h.beds[acuity].avail < 1) return false;
    return true;
  });

  const scored = candidates.map(h => {
    let score = 0;
    const bedPct = h.beds[acuity].total > 0 ? h.beds[acuity].avail / h.beds[acuity].total : 0;
    score += bedPct * 40;
    const hasSpec = specialty === 'any' || h.specialties.includes(specialty) || h.specialties.includes('any');
    if (hasSpec) score += 35;
    if (h.type === 'tertiary') score += 15;
    else if (h.type === 'regional') score += 10;
    if (h.transfer_center) score += 10;
    return {...h, score: Math.round(score), hasSpec, bedAvail: h.beds[acuity].avail, bedTotal: h.beds[acuity].total};
  }).sort((a,b) => b.score - a.score).slice(0,4);

  const div = document.getElementById('transfer-results');
  if (!scored.length) { div.innerHTML = '<div class="empty-state">No hospitals with available capacity for this acuity level.<br>Consider out-of-state transfer or air transport to tertiary center.</div>'; return; }

  div.innerHTML = `<div class="section-label" style="margin-bottom:10px">Recommended receiving hospitals</div><div class="result-list">${scored.map((h,i) => {
    const tags = [
      {label: `${h.bedAvail} ${acuity} beds`, hit: h.bedAvail > 3},
      {label: h.hasSpec ? specialty === 'any' ? 'general med' : specialty : 'no '+specialty, hit: h.hasSpec},
      {label: h.transfer_center ? 'transfer center' : 'direct admit', hit: h.transfer_center},
      {label: h.type, hit: true},
    ];
    return `<div class="result-row">
      <div class="rank-badge rank-${i+1}">${i+1}</div>
      <div class="result-info">
        <div class="result-name">${h.name}</div>
        <div class="result-meta">${h.region} county · ${h.type}</div>
        <div class="match-tags">${tags.map(t=>`<span class="match-tag${t.hit?' hit':''}">${t.label}</span>`).join('')}</div>
      </div>
      <div class="result-score"><div class="score-num">${h.score}</div><div class="score-label">match score</div></div>
    </div>`;
  }).join('')}</div>`;
}

function renderRepat(filter='all') {
  const list = document.getElementById('repat-list');
  let patients = REPAT_PATIENTS;
  if (filter !== 'all') patients = patients.filter(p => p.at === filter);
  patients = [...patients].sort((a,b) => b.days_over - a.days_over);

  list.innerHTML = patients.map(p => {
    const homeH = HOSPITALS.find(h => h.short === p.home || h.name.includes(p.home));
    const bedAvail = homeH ? homeH.beds[p.acuity].avail : '?';
    const canRepatriate = bedAvail > 0;
    return `<div class="repat-row">
      <div style="width:36px;height:36px;border-radius:50%;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;flex-shrink:0;color:var(--color-text-secondary)">${p.name.split(' ').map(w=>w[0]).join('')}</div>
      <div class="repat-info">
        <div class="repat-name">${p.name} · ${p.age}y · ${p.dx}</div>
        <div class="repat-sub">At <b>${p.at}</b> → home hospital: <b>${p.home}</b> · ${p.acuity} · ${p.specialty}</div>
        <div class="repat-days">LOS: ${p.los} days (target ${p.target_los}) — <span>${p.days_over}d over target</span></div>
        <div style="font-size:11px;color:var(--color-text-tertiary);margin-top:3px">${p.blocker} · ${p.home} ${p.acuity} beds: <span style="color:${canRepatriate?'#3B6D11':'#A32D2D'};font-weight:500">${bedAvail} avail</span></div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <button class="action-btn" style="${canRepatriate?'border-color:#B5D4F4;color:#185FA5':''}" onclick="alert('Transfer coordination initiated for ${p.name}')">
          ${canRepatriate ? 'Initiate transfer' : 'No bed available'}
        </button>
      </div>
    </div>`;
  }).join('');
}

function filterRepat(val) { repatFilter = val; renderRepat(val); }

function showTab(name) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['capacity','transfer','repat'][i] === name));
  document.querySelectorAll('.panel').forEach((p,i) => p.classList.toggle('active', ['panel-capacity','panel-transfer','panel-repat'][i] === 'panel-'+name));
}

renderTicker();
renderGrid();
populateTransferSelect();
renderRepat();
</script>
