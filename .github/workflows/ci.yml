name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Minimal env needed to build without Sentry source maps upload
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: "2023-10-01"
          NEXT_PUBLIC_APP_URL: https://localhost:3000
          # Skip Sentry source map upload in CI
          SENTRY_AUTH_TOKEN: ""

  # ── Backend ───────────────────────────────────────────────────────────────────
  backend:
    name: Backend (lint + type check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dev linting tools
        run: pip install ruff mypy

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy main.py --ignore-missing-imports --no-strict-optional
        continue-on-error: true  # Non-blocking until type coverage improves

      - name: Test (pytest)
        run: python -m pytest tests/ -v --tb=short
        continue-on-error: true  # Non-blocking until test suite is established

  # ── Deploy (main branch only) ─────────────────────────────────────────────────
  deploy-notify:
    name: Deployment ready
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Notify deployment readiness
        run: |
          echo "✅ All checks passed on main."
          echo "Vercel will auto-deploy the frontend."
          echo "Railway will auto-deploy the backend."
          echo "Run POST /api/ingest on Railway after backend deploy to rebuild the RAG index."
