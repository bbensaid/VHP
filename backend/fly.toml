# fly.toml app configuration file generated for vhp-backend on 2026-05-09T23:53:25-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vhp-backend'
primary_region = 'sjc'

[build]
  [build.args]

[processes]
  app = "/app/.venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000"

[http_service]
  internal_port = 8000
  force_https = true
  # Scale-to-zero. The machine sleeps when idle; the first request after a
  # quiet period pays a 5-15s cold start (can exceed the 60s Vercel function
  # limit and surface as an error to the user on that first request only).
  # Billing drops from ~$5.70/mo (always-on) to ~$1-3/mo (idle-scaled).
  #
  # TO REVERT (always-on, no cold start): set min_machines_running back to 1
  # and auto_stop_machines to 'off', then `flyctl deploy` (or push a change
  # under backend/ and let the GitHub Action redeploy).
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
